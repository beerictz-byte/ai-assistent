<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0b0b0f">
<title>עוזר AI</title>
<style>
:root{--bg:#0b0b0f;--panel:#15151c;--line:#26262f;--txt:#f2f2f5;--mut:#9a9aa6;--me:#2e2e3a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;flex-direction:column;height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:17px;font-weight:600;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 6px #3ddc84}
.iconbtn{background:transparent;border:1px solid var(--line);color:var(--txt);width:36px;height:36px;border-radius:10px;font-size:17px;cursor:pointer}
#chat{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:84%;padding:10px 14px;border-radius:16px;font-size:16px;line-height:1.55;white-space:pre-wrap;word-break:break-word;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:4px}
.bot a{color:#8ab4f8}
.dots{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:4px;padding:14px 16px;display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:b 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-4px);opacity:1}}
#chips{display:flex;gap:8px;padding:8px 12px;overflow-x:auto;flex-shrink:0}
.chip{flex-shrink:0;font-size:14px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--txt);cursor:pointer}
#bar{display:flex;gap:8px;padding:10px 12px 14px;border-top:1px solid var(--line);align-items:flex-end}
#inp{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;color:var(--txt);padding:11px 14px;font-size:16px;resize:none;max-height:120px;outline:none;font-family:inherit}
#inp:focus{border-color:#555}
#send{background:#f2f2f5;color:#0b0b0f;border:none;border-radius:12px;padding:0 18px;height:44px;font-size:16px;font-weight:600;cursor:pointer}
#send:disabled{opacity:.4}
#mic{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--txt);font-size:18px;cursor:pointer}
#mic.rec{background:#b3261e;border-color:#b3261e;color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
#settings{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
#settings.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 18px 28px;width:100%;max-height:85dvh;overflow-y:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-size:18px;margin-bottom:12px}
.sheet label{font-size:14px;color:var(--mut);display:block;margin-bottom:6px}
.sheet input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px;font-size:15px;outline:none;margin-bottom:10px}
.sheet input:focus{border-color:#555}
.btn{width:100%;padding:13px;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:6px}
.btn.primary{background:#f2f2f5;color:#0b0b0f}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.note{font-size:13px;color:var(--mut);line-height:1.6;margin:8px 0}
.note a{color:#8ab4f8}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);color:var(--txt);padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:20;max-width:88%;text-align:center}
</style>
<base target="_blank">
</head>
<body>
<header>
<div class="dot"></div>
<h1>עוזר AI</h1>
<button class="iconbtn" id="gear" title="הגדרות">&#9881;</button>
</header>
<div id="chat"></div>
<div id="chips"></div>
<div id="bar">
<button id="mic" title="הקלטה">&#127908;</button>
<textarea id="inp" rows="1" placeholder="שאל משהו…"></textarea>
<button id="send">שלח</button>
</div>

<div id="settings"><div class="sheet">
<h2>הגדרות</h2>
<p class="note">כדי שהעוזר יעבוד וימשוך נתונים עדכניים (כולל 2026) מהאינטרנט, צריך מפתח API חינמי מגוגל:
<br>1. פתח בדפדפן את <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a>
<br>2. התחבר עם חשבון גוגל שלך
<br>3. לחץ <b>Create API key</b> והעתק את המפתח
<br>4. הדבק כאן למטה</p>
<label>מפתח API של גוגל (Gemini)</label>
<input id="apikey" type="password" placeholder="הדבק כאן את המפתח" autocomplete="off">
<button class="btn primary" id="savekey">שמור והתחל</button>
<button class="btn ghost" id="close">סגור</button>
<p class="note">המפתח נשמר רק על הטלפון שלך, לא נשלח לאף אחד חוץ מגוגל.</p>
</div></div>

<div id="toast"></div>

<script>
var PRESET_KEY=''; /* <<< הדבק כאן את המפתח שלך בין הגרשיים, אז לא צריך להזין כלום בטלפון */
var KEY=(PRESET_KEY||localStorage.getItem('gk')||''),hist=[];
try{hist=JSON.parse(localStorage.getItem('hist')||'[]')}catch(e){hist=[]}
var chat=document.getElementById('chat'),inp=document.getElementById('inp'),send=document.getElementById('send');
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(function(){el.style.display='none'},3500)}
function saveHist(){try{localStorage.setItem('hist',JSON.stringify(hist.slice(-40)))}catch(e){}}
function add(t,cls,html){var d=document.createElement('div');d.className='msg '+cls;if(html){d.innerHTML=t}else{d.textContent=t}chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function renderHist(){chat.innerHTML='';if(!hist.length){add('שלום! אני העוזר החכם שלך. יש לי גישה לחיפוש חי באינטרנט, אז הנתונים שלי עדכניים ל-2026. שאל אותי על חדשות, מזג אוויר, כל דבר.','bot')}hist.forEach(function(m){add(esc(m.parts[0].text),m.role==='model'?'bot':'me')});chat.scrollTop=chat.scrollHeight}
function md(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>')}
function ask(){
 var t=inp.value.trim();if(!t)return;
 if(!KEY){document.getElementById('settings').classList.add('open');toast('קודם צריך להכניס מפתח API');return}
 inp.value='';inp.style.height='auto';
 add(esc(t),'me');
 hist.push({role:'user',parts:[{text:t}]});
 var ty=document.createElement('div');ty.className='dots';ty.innerHTML='<i></i><i></i><i></i>';chat.appendChild(ty);chat.scrollTop=chat.scrollHeight;
 send.disabled=true;
 var url='https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:streamGenerateContent?alt=sse&key='+encodeURIComponent(KEY);
 var body={system_instruction:{parts:[{text:'You are a helpful assistant. Answer in Hebrew unless the user writes in another language. Be concise, warm and accurate. Use the search tool for anything time-sensitive.'}]},contents:hist,tools:[{google_search:{}}]};
 var acc='',buf='';
 fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){
  if(!r.ok){throw new Error('http'+r.status)}
  var rd=r.body.getReader(),dec=new TextDecoder();ty.remove();
  var bub=add('','bot');
  function pump(){return rd.read().then(function(res){
   if(res.done){finish();return}
   buf+=dec.decode(res.value,{stream:true});
   var ls=buf.split('\n');buf=ls.pop();
   ls.forEach(function(l){
    if(l.indexOf('data:')!==0)return;
    try{var j=JSON.parse(l.slice(5));var cs=j.candidates&&j.candidates[0];if(cs&&cs.content&&cs.content.parts){cs.content.parts.forEach(function(p){if(p.text){acc+=p.text;bub.innerHTML=md(acc);chat.scrollTop=chat.scrollHeight}})}}catch(e){}
   });
   return pump();
  })}
  return pump();
 }).catch(function(e){ty.remove();if(!acc){var m=e.message&&e.message.indexOf('http400')===0?'המפתח לא תקין — בדוק שהעתקת אותו במלואו.':e.message&&e.message.indexOf('http403')===0?'המפתח חסום או שאין הרשאה — צור מפתח חדש.':'בעיית תקשורת. בדוק שיש אינטרנט ונסה שוב.';add(m,'bot')}});
 function finish(){if(acc){hist.push({role:'model',parts:[{text:acc}]});saveHist()}send.disabled=false}
}
send.onclick=ask;
inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'});
document.getElementById('gear').onclick=function(){document.getElementById('apikey').value=KEY;document.getElementById('settings').classList.add('open')};
document.getElementById('close').onclick=function(){document.getElementById('settings').classList.remove('open')};
document.getElementById('savekey').onclick=function(){var v=document.getElementById('apikey').value.trim();if(!v){toast('הדבק מפתח קודם');return}KEY=v;localStorage.setItem('gk',v);document.getElementById('settings').classList.remove('open');toast('נשמר! אפשר להתחיל לשאול')};
var sugg=['מה חדשות היום?','מה המזג אוויר עכשיו?','תסכם לי את ידיעות היום','איך אומרים שלום ביפנית?'];
var cw=document.getElementById('chips');
sugg.forEach(function(s){var b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=function(){inp.value=s;ask()};cw.appendChild(b)});
/* הקלטה קולית */
var rec=null,listening=false;
document.getElementById('mic').onclick=function(){
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast('הדפדפן לא תומך בהקלטה קולית');return}
 if(listening){rec.stop();return}
 rec=new SR();rec.lang='he-IL';rec.interimResults=true;
 rec.onresult=function(e){var s='';for(var i=0;i<e.results.length;i++){s+=e.results[i][0].transcript}inp.value=s};
 rec.onend=function(){listening=false;document.getElementById('mic').classList.remove('rec')};
 rec.onerror=function(){listening=false;document.getElementById('mic').classList.remove('rec');toast('לא הצלחתי להקשיב — נסה שוב')};
 try{rec.start();listening=true;document.getElementById('mic').classList.add('rec')}catch(e){}
};
renderHist();
if(!KEY){setTimeout(function(){document.getElementById('settings').classList.add('open')},400)}
</script>
</body>
</html>
